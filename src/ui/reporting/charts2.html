<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>XDB - Dynamic Charts</title>
		<LINK REL="SHORTCUT ICON" HREF="../images/favicon.ico" />
		<link type="text/css" href="../css/jquery-ui-1.9.2.custom.min.css" rel="stylesheet" />
		<link type="text/css" href="../css/xdb.core.css" rel="stylesheet" />
		<link type="text/css" href="../css/ui.jqgrid.min.css" rel="stylesheet" />
		<link type="text/css" href="../css/ui.multiselect.min.css" rel="stylesheet" />
		<style>
			.resizer {
			    border: 1px solid silver;
			}
			.inner-resizer { /* make room for the resize handle */
			    padding: 5px;
			    border-style:none;
			}
			.growlLink { font-size: 12pt; font-face: verdana; color: #FFFFFF; }
		</style>
	</head>
	<body>
		<div id="container">
			<div id="header"></div>
			<div id="navigation"></div>
			<div id="content" style="width:auto;">
				<span id="driverCaption">Asset Type:</span>
				<select id="lstAssetTypes" class="ui-widget ui-state-default" onChange="onAssetTypeChanged(this)" ></select>
				<select id="lstRequestTypes" class="ui-widget ui-state-default" onChange="onRequestTypeChanged(null)" style="display:none" ></select>
				<label id="lblBy" style="display:none">by</label>
				<select id="lstProperties" class="ui-widget ui-state-default" onChange="onPropertyChanged(this)" style="display:none"></select>
				<select id="lstMax" class="ui-widget ui-state-default" onChange="onMaxChanged(this)" style="display:none"></select>
				<label id="lblWhere" style="display:none">(optional) where</label>
				<select id="lstProperties2" class="ui-widget ui-state-default" onChange="onProperty2Changed(this)" style="display:none;"></select>
				<select id="lstOperators" class="ui-widget ui-state-default" onChange="onOperatorChanged(this)" style="display:none"></select>
				<select id="lstValues" class="ui-widget ui-state-default" onChange="onValueChanged(this)" style="display:none"></select>
				<span id="dash" style="display:none; float:right; margin-right: 15px;" class="ui-icon ui-icon-image" onClick="buildDashDialog()"></span>
				<div id="innerContent" style="display:none; width:100%; overflow:auto; padding-top:1em;">
					<div id="left" style="padding-right:2px; width:20%; float:left; font-size:.9em; font-family: Century Gothic, sans-serif;">
						<div id="filters"></div>
						<div id="accordion"></div>
					</div>
					<!--<div id="accordion" style="width:20%; float:left; font-size:.9em; font-family: Century Gothic, sans-serif;"></div>-->
					<div id="tabs" style="width:79%; float:left; padding-top:2px;">
						<ul>
							<li><a href="#tabs-1">Show It</a></li>
					        <li><a href="#tabs-2">Map It</a></li>
					        <li><a href="#tabs-3">Prove It</a></li>
						</ul>
						<div id="tabs-1">
							<div id="chart00" style="width:98%;"></div>
						</div>
						<div id="tabs-2">
    						<div id="map_canvas" style="width:98%;"></div>
						</div>
						<div id="tabs-3">
							<div style="width:100%; overflow-x:auto;">
								<table id="refData" style="width:100%">
									<tr style="width:100%">
										<td style="width:100%"></td>
									</tr>
								</table>
							</div>
							<div id="pager"></div>
						</div>
				 	</div>
				 </div>
			</div>
			<div id="footer"></div>
		</div>
		<div id="runAsDialog" title="Run-As Another User">
			<input style="width:100%;" id="lstUsers" class="ui-widget ui-state-default"/>
			<input type="hidden" id="lstUsers-id"/>
		</div>
		<div id="messageDialog" style="display: none"></div>
		<span id="spanGreeting"></span>
		<form class="searchform" onsubmit="return false;">
			<input id="txtSearchField" class="searchfield" type="text" value="Search..." onfocus="onSearchAreaFocus(this)" onblur="onSearchAreaBlur(this)" onkeyup="onSearchPhraseChanged(event)" />
			<input class="x-search-24 searchbutton" type="button" onClick="onSearch()" />
		</form>
	</body>
		<script type="text/javascript" src="../js/xdb.core.js"></script>
		<script type="text/javascript" src="../js/ui.multiselect.min.js"></script>
		<script type="text/javascript" src="../js/jquery.growl.min.js"></script>
		<script type="text/javascript" src="../js/grid.locale-en.min.js"></script>
		<script type="text/javascript" src="../js/jquery.jqGrid.src.min.js"></script>
		<script type="text/javascript">if(typeof MAPS_API_KEY==="string"&&MAPS_API_KEY!==""){document.write('<script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(MAPS_API_KEY)+'"><\/script>');document.write('<script type="text/javascript" src="../js/infobox_packed.js"><\/script>');}</script>
		<script type="text/javascript" src="https://code.highcharts.com/2.3.5/highcharts.js"></script>
		<script type="text/javascript" src="../js/xdb.charting.js"></script>
    <script type="text/javascript">$(document).ready(function() { initForm(); });</script>
</html>
