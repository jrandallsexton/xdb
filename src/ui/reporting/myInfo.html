<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>XDB - Asset Explorer - My Info</title>
		<LINK REL="SHORTCUT ICON" HREF="../images/favicon.ico" />
		<link type="text/css" href="../css/jquery-ui-1.9.2.custom.min.css" rel="stylesheet" />
		<link type="text/css" href="../css/xdb.core.css" rel="stylesheet" />
	</head>
	<body>
		<div id="container">
			<div id="header"></div>
			<div id="navigation"></div>
			<div id="content" style="width:99.4%; border:none;">
				<h2>You are the:</h2>
				<div id="myInfo" style="width:99%;"></div>
			</div>
			<div id="footer"></div>
		</div>
		<div id="runAsDialog" title="Run-As Another User">
			<input style="width:100%;" id="lstUsers" class="ui-widget ui-state-default"/>
			<input type="hidden" id="lstUsers-id"/>
		</div>
		<div id="messageDialog" style="display: none" title=""></div>
		<span id="spanGreeting"></span>
		<form class="searchform" onsubmit="return false;">
			<input id="txtSearchField" class="searchfield" type="text" value="Search..." onfocus="onSearchAreaFocus(this)" onblur="onSearchAreaBlur(this)" onkeyup="onSearchPhraseChanged(event)" />
			<input class="x-search-24 searchbutton" type="button" onClick="onSearch()" />
		</form>
	</body>
		<script type="text/javascript" src="../js/xdb.core.js"></script>
		<script type="text/javascript" src="../js/xdb.api.admin.js"></script>
		<script type="text/javascript" src="../js/xdb.info.js"></script>
	<script type="text/javascript">$(document).ready(function () { initForm(); });</script>
</html>
