<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>XDB - Bulk Upload Utility</title>
		<link type="text/css" href="../css/jquery-ui-1.9.2.custom.min.css" rel="stylesheet" />
		<link type="text/css" href="../css/xdb.core.0.1.0.min.css" rel="stylesheet" />
		<link type="text/css" href="../css/jquery.fileupload-ui.min.css" rel="stylesheet" />
		<!--<style type="text/css">
			div.header,div.footer
			{
				padding:0.5em;
				color:white;
				background-color:#1F4E79;
				clear:left;
				color:#ffffff;
				font-family: Arial,sans-serif;
			}
		</style>-->
	</head>
	<body>
		<div id="container">
			<div id="header"></div>
			<div id="navigation"></div>
			<div id="content">
				<div id="fileupload" class="fileupload">
				    <form method="POST" enctype="multipart/form-data">
				        <div id="buttonBar" class="fileupload-buttonbar" style="width:43%">
			                <span>Select Upload Template:</span><br/><br/>
				            <!--<label class="fileinput-button">-->
				            	<input type="file" name="files[]" size="100">
			            	<!--</label>-->
				        </div>
				    </form>
				    <div class="fileupload-content">
				        <table class="files"></table>
				        <div class="fileupload-progressbar"></div>
				    </div>
				</div>
				<br/>
				<div id="divOptions">
					<input type="checkbox" checked="checked" id="Info">Info</input>
					<input type="checkbox" checked="checked" id="Warning">Warning</input>
					<input type="checkbox" checked="checked" id="Error">Error</input>
				</div>
				<div id="processingResults"></div>
			</div>
			<div id="footer"></div>
		</div>
		<div id="runAsDialog" title="Run-As Another User">
			<input style="width:100%;" id="lstUsers" class="ui-widget ui-state-default"/>
			<input type="hidden" id="lstUsers-id"/>
		</div>
		<div id="messageDialog" style="display: none" title=""></div>
		<span id="spanGreeting"></span>
		<form class="searchform" onsubmit="return false;">
			<input id="txtSearchField" class="searchfield" type="text" value="Search..." onfocus="onSearchAreaFocus(this)" onblur="onSearchAreaBlur(this)" onkeyup="onSearchPhraseChanged(event)" />
			<input class="searchbutton" type="button" onClick="onSearch()" />
		</form>
	</body>
		<script type="text/javascript" src="../js/xdb.core.0.1.0.min.js"></script>
		<script type="text/javascript" src="../js/jquery.tmpl.min.js"></script>
		<script type="text/javascript" src="../js/jquery.iframe-transport.min.js"></script>
		<script type="text/javascript" src="../js/jquery.fileupload.min.js"></script>
		<script type="text/javascript" src="../js/jquery.fileupload-ui.min.js"></script>
		<script type="text/javascript" src="../js/xdb.uploader.0.1.0.min.js"></script>
	<script id="template-upload" type="text/x-jquery-tmpl">
	    <tr class="template-upload{{if error}} ui-state-error{{/if}}">
	        <td class="preview"></td>
	        <td class="name">${name}</td>
	        <td class="size">${sizef}</td>
	        {{if error}}
	            <td class="error" colspan="2">Error:
	                {{if error === 'maxFileSize'}}File is too big
	                {{else error === 'minFileSize'}}File is too small
	                {{else error === 'acceptFileTypes'}}Filetype not allowed
	                {{else error === 'maxNumberOfFiles'}}Max number of files exceeded
	                {{else}}${error}
	                {{/if}}
	            </td>
	        {{else}}
	            <td class="progress"><div></div></td>
	            <td class="start"><button>Start</button></td>
	        {{/if}}
	        <td class="cancel"><button>Cancel</button></td>
	    </tr>
	</script>
	<script id="template-download" type="text/x-jquery-tmpl">
	    <tr class="template-download{{if error}} ui-state-error{{/if}}">
	        {{if error}}
	            <td></td>
	            <td class="name">${name}</td>
	            <td class="size">${sizef}</td>
	            <td class="error" colspan="2">Error:
	                {{if error === 1}}File exceeds upload_max_filesize (php.ini directive)
	                {{else error === 2}}File exceeds MAX_FILE_SIZE (HTML form directive)
	                {{else error === 3}}File was only partially uploaded
	                {{else error === 4}}No File was uploaded
	                {{else error === 5}}Missing a temporary folder
	                {{else error === 6}}Failed to write file to disk
	                {{else error === 7}}File upload stopped by extension
	                {{else error === 'maxFileSize'}}File is too big
	                {{else error === 'minFileSize'}}File is too small
	                {{else error === 'acceptFileTypes'}}Filetype not allowed
	                {{else error === 'maxNumberOfFiles'}}Max number of files exceeded
	                {{else error === 'uploadedBytes'}}Uploaded bytes exceed file size
	                {{else error === 'emptyResult'}}Empty file upload result
	                {{else}}${error}
	                {{/if}}
	            </td>
	        {{else}}
	            <td class="preview">
	                {{if thumbnail_url}}
	                    <a href="${url}" target="_blank"><img src="${thumbnail_url}"/></a>
	                {{/if}}
	            </td>
	            <td class="name">
	                <a href="${url}" {{if thumbnail_url}} target="_blank" {{/if}}>${name}</a>
	            </td>
	            <td class="size">${sizef}</td>
	            <td colspan="2"></td>
	        {{/if}}
	        <td class="delete">
	            <button data-type="${delete_type}" data-url="${delete_url}">Delete</button>
	        </td>
	    </tr>
	</script>
    <script type="text/javascript">$(document).ready(function() { initForm(); } );</script>
</html>
