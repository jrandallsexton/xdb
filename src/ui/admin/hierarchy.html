<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>XDB - Asset Type Hierarchy</title>
		<LINK REL="SHORTCUT ICON" href="../images/favicon.ico" />
		<link type="text/css" href="../css/jquery-ui-1.9.2.custom.min.css" rel="stylesheet" />
		<link type="text/css" href="../css/xdb.core.0.1.0.min.css" rel="stylesheet" />
	</head>
	<body>
		<div id="container">
			<div id="header"></div>
			<div id="navigation"></div>
			<div id="content">
				<div id="treAllItems" class="demo jstree jstree-0 jstree-default jstree-focused" ></div>
			</div>
			<div id="footer"></div>
		</div>
		<div id="runAsDialog" title="Run-As Another User">
			<input style="width:100%;" id="lstUsers" class="ui-widget ui-state-default" onkeyup="onRunAsUserChanged(event)"/>
			<input type="hidden" id="lstUsers-id"/>
		</div>
		<div id="messageDialog" style="display: none"></div>
		<span id="spanGreeting"></span>
		<form class="searchform" onsubmit="return false;">
			<input id="txtSearchField" class="searchfield" type="text" value="Search..." onfocus="onSearchAreaFocus(this)" onblur="onSearchAreaBlur(this)" onkeyup="onSearchPhraseChanged(event)" />
			<input class="x-search-24 searchbutton" type="button" onClick="onSearch()" />
		</form>
	</body>
		<script type="text/javascript" src="../js/xdb.core.0.1.0.min.js"></script>
		<script type="text/javascript" src="../js/jquery.jstree.min.js"></script>
		<script type="text/javascript" src="../js/xdb.api.admin.0.1.0.min.js"></script>
		<script type="text/javascript" src="../js/xdb.admin.hierarchy.0.1.0.min.js"></script>
    <script type="text/javascript">$(document).ready(function () { initForm(); });</script>
</html>
