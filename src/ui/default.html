<!DOCTYPE html>
<html>
	<head>
		<meta charset='utf-8'/>
		<title>XDB</title>
		<LINK REL="SHORTCUT ICON" href="images/favicon.ico" />
		<link type="text/css" href="css/jquery-ui-1.9.2.custom.min.css" rel="stylesheet" />
		<link type="text/css" href="css/xdb.core.0.1.0.min.css" rel="stylesheet" />
	</head>
	<body>
		<div id="container">
			<div id="header"></div>
			<div id="navigation"></div>
			<div id="content">
				<div id="divContent" class="innerContainer">
					<div class="left">
						<div id="items"></div>
					</div>
					<div id="innerContent" class="innerContent">
						<div id="defaultView">
							<div id="rss"></div>
						</div>
						<div id="results" class="searchResult"></div>
						<img id="imgSearch" width="32" height="32" display="none" src='images/ajax-loader.gif' alt="spinner"/>
						<div id="search" class="search" display="none"></div>
						<div id="loadingImg">
							<img width="32" height="32" src="images/ajax-loader.gif" alt="spinner" />
							<label>Determining access ...</label>
						</div>
						<div id="noAccessDiv" class="hideOnStartup">
							<div><b>You do not currently have access to XDB.<br/>Please contact your administrator.</b></div>
						</div>
					</div>
				</div>
			</div>
			<div id="footer"></div>
		</div>
		<div id="runAsDialog" title="Run-As Another User">
			<input style="width:100%;" id="lstUsers" class="ui-widget ui-state-default" onkeyup="onRunAsUserChanged(event)"/>
			<input type="hidden" id="lstUsers-id"/>
		</div>
		<div id="messageDialog"></div>
		<div id="spanGreeting"></div>
		<form id="searchform" class="searchform" onsubmit="return false;">
			<input id="txtSearchField" class="searchfield" type="text" value="Search..." onfocus="onSearchAreaFocus(this)" onblur="onSearchAreaBlur(this)" onkeyup="onSearchChangedDefault(event)" />
			<input width="24" height="24" class="x-search-24 searchbutton" type="button" onclick="onSearchDefault()" />
		</form>
		<script type="text/javascript" src="js/xdb.core.0.1.0.min.js"></script>
		<script type="text/javascript" src="js/xdb.filtering.0.1.0.min.js"></script>
		<script type="text/javascript" src="js/xdb.default.0.1.0.min.js"></script>
		<!--<script type="text/javascript" src="js/jquery.growl.js"></script>-->
		<!--<script type="text/javascript" src="js/jquery.metadata.js"></script>-->
	    <script type="text/javascript" >$(document).ready(function () { initDefaultHtml(); });</script>
	</body>
</html>
